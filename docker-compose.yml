services:
  stats-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "6655:6655"
    volumes:
      - ./runtime:/runtime
    env_file:
      - .env
    environment:
      STATS_DATABASE_PATH: /runtime/stats.sqlite3
      STATS_IMAGE_DIR: /runtime/images
      MEILISEARCH_URL: http://meilisearch:7700
    restart: unless-stopped
    depends_on:
      meilisearch-bootstrap:
        condition: service_completed_successfully

  stats-review:
    build:
      context: .
      dockerfile: private-review/Dockerfile
    ports:
      - "9981:9981"
    volumes:
      - ./runtime:/runtime
    env_file:
      - .env
    environment:
      STATS_DATABASE_PATH: /runtime/stats.sqlite3
      STATS_IMAGE_DIR: /runtime/images
      MEILISEARCH_URL: http://meilisearch:7700
    restart: unless-stopped
    depends_on:
      meilisearch-bootstrap:
        condition: service_completed_successfully

  meilisearch:
    image: getmeili/meilisearch:v1.15
    env_file:
      - .env
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - ./runtime/meilisearch:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch-bootstrap:
    build:
      context: .
      dockerfile: private-review/Dockerfile
    command: ["python", "-m", "shared.bootstrap"]
    volumes:
      - ./runtime:/runtime
      - ./stats:/legacy-stats:ro
    env_file:
      - .env
    environment:
      STATS_DATABASE_PATH: /runtime/stats.sqlite3
      STATS_IMAGE_DIR: /runtime/images
      LEGACY_STATS_DIR: /legacy-stats
      MEILISEARCH_URL: http://meilisearch:7700
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: "no"
