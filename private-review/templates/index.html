<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Review</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --border: #dfe3e8;
            --muted: #687385;
            --text: #172033;
            --primary: #2457d6;
            --primary-dark: #1946b7;
            --success: #16834b;
            --warning-bg: #fff7df;
            --warning: #805b00;
            --danger-bg: #fff0f0;
            --danger: #a12727;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, textarea {
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 68px;
            padding: 12px max(18px, calc((100vw - 1500px) / 2));
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .brand h1 {
            margin: 0;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        .queue-count {
            padding: 4px 9px;
            border-radius: 999px;
            background: #eef2ff;
            color: #384b9e;
            font-size: 12px;
            font-weight: 700;
        }

        .queue-navigation {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .position {
            min-width: 82px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(360px, 0.9fr) minmax(440px, 1.1fr);
            gap: 18px;
            width: min(1500px, calc(100% - 32px));
            margin: 18px auto 100px;
        }

        .panel {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 3px 12px rgba(26, 36, 56, 0.04);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 55px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header h2 {
            overflow: hidden;
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-body {
            padding: 16px;
        }

        .source-image-wrap {
            display: grid;
            min-height: 280px;
            max-height: 52vh;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background:
                linear-gradient(45deg, #f2f3f5 25%, transparent 25%),
                linear-gradient(-45deg, #f2f3f5 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f2f3f5 75%),
                linear-gradient(-45deg, transparent 75%, #f2f3f5 75%);
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            background-size: 16px 16px;
            place-items: center;
        }

        #sourceImage {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: zoom-in;
        }

        .editor-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0 7px;
            font-size: 13px;
            font-weight: 700;
        }

        #jsonStatus {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        #jsonStatus.invalid {
            color: var(--danger);
        }

        #jsonEditor {
            width: 100%;
            min-height: 300px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #fafbfc;
            color: #162033;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            line-height: 1.55;
            resize: vertical;
            tab-size: 4;
        }

        #jsonEditor:focus {
            border-color: #8aa8f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.1);
        }

        .preview {
            min-height: 600px;
            overflow-x: auto;
        }

        .preview-placeholder {
            display: grid;
            min-height: 420px;
            color: var(--muted);
            text-align: center;
            place-items: center;
        }

        .preview h3 {
            margin: 0 0 14px;
            font-size: 17px;
        }

        .preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .preview td {
            padding: 5px 8px 5px 0;
            vertical-align: top;
        }

        .preview td:first-child {
            width: 1%;
            color: var(--muted);
            white-space: nowrap;
        }

        .notice {
            display: none;
            margin: 0 0 14px;
            padding: 11px 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.45;
        }

        .notice.warning {
            border: 1px solid #f2d47b;
            background: var(--warning-bg);
            color: var(--warning);
        }

        .notice.error {
            border: 1px solid #efb5b5;
            background: var(--danger-bg);
            color: var(--danger);
        }

        .notice a {
            color: inherit;
            font-weight: 700;
        }

        .actions {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 13px max(18px, calc((100vw - 1500px) / 2));
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
        }

        .btn {
            min-height: 40px;
            padding: 9px 15px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: #344054;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .btn:hover:not(:disabled) {
            background: #f7f8fa;
        }

        .btn:disabled {
            cursor: default;
            opacity: 0.45;
        }

        .btn-primary {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn-success {
            min-width: 150px;
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .shortcut {
            margin-left: 6px;
            opacity: 0.65;
            font-size: 11px;
            font-weight: 500;
        }

        .empty-state {
            display: grid;
            min-height: calc(100vh - 68px);
            padding: 30px;
            color: var(--muted);
            text-align: center;
            place-items: center;
        }

        .empty-state h2 {
            margin: 0 0 8px;
            color: var(--text);
        }

        .bar-label {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: max-content;
            margin-bottom: 0.3em;
            transform: translateX(-50%);
            color: black;
            font-size: 0.65em;
            text-align: center;
            white-space: nowrap;
        }

        .grade-chart > div:nth-child(even) .bar-label {
            margin-bottom: 2.5em;
        }

        .grade-chart {
            width: 100% !important;
            margin: 3em 0 !important;
            padding: 0 !important;
        }

        .grade-chart > div {
            flex: 1 !important;
            margin: 0 !important;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .source-image-wrap {
                max-height: 60vh;
            }
        }

        @media (max-width: 620px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .queue-navigation {
                width: 100%;
                justify-content: space-between;
            }

            .workspace {
                width: min(100% - 20px, 1500px);
                margin-top: 10px;
            }

            .panel-body {
                padding: 12px;
            }

            .actions {
                justify-content: stretch;
            }

            .actions .btn {
                flex: 1;
                padding-inline: 8px;
            }

            .shortcut {
                display: none;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <h1>Stats Review</h1>
        <span class="queue-count" id="queueCount">{{ items | length }} pending</span>
    </div>
    <nav class="queue-navigation" aria-label="Review queue navigation">
        <button class="btn" id="previousButton" type="button">← Previous</button>
        <span class="position" id="queuePosition"></span>
        <button class="btn" id="nextButton" type="button">Next →</button>
    </nav>
</header>

{% if items | length == 0 %}
<main class="empty-state">
    <div>
        <h2>All caught up</h2>
        <p>There are no exam statistics waiting for review.</p>
    </div>
</main>
{% else %}
<main class="workspace" id="workspace">
    <section class="panel">
        <div class="panel-header">
            <h2 id="itemTitle">Submission</h2>
            <a class="btn" id="openImageLink" href="#" target="_blank" rel="noopener">Open image</a>
        </div>
        <div class="panel-body">
            <div class="source-image-wrap">
                <img id="sourceImage" alt="Uploaded exam statistics screenshot">
            </div>
            <label class="editor-label" for="jsonEditor">
                Extracted JSON
                <span id="jsonStatus">Valid JSON</span>
            </label>
            <textarea id="jsonEditor" spellcheck="false"></textarea>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>Publication preview</h2>
            <a class="btn" id="existingEntryLink" href="#" target="_blank" rel="noopener">View on site</a>
        </div>
        <div class="panel-body preview" id="preview">
            <div class="preview-placeholder">Generating preview…</div>
        </div>
    </section>
</main>

<footer class="actions">
    <button class="btn" id="formatButton" type="button">Format JSON</button>
    <button class="btn btn-primary" id="previewButton" type="button">Update preview <span class="shortcut">Ctrl ↵</span></button>
    <button class="btn btn-success" id="approveButton" type="button">Approve & next <span class="shortcut">Ctrl ⇧ ↵</span></button>
</footer>
{% endif %}

<script>
    const REVIEW_ITEMS = {{ items | tojson }};
    const IS_DEV = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
    const SITE_URL = IS_DEV ? 'http://localhost' : 'https://stats.aamin.dev';
    const API_URL = IS_DEV ? 'http://localhost:6655' : 'https://stats-api.aamin.dev';

    let currentIndex = 0;
    let previewRequest = 0;
    const editedData = new Map();

    function parseEditor(showError) {
        const editor = document.getElementById('jsonEditor');
        const status = document.getElementById('jsonStatus');
        try {
            const data = JSON.parse(editor.value);
            status.textContent = 'Valid JSON';
            status.classList.remove('invalid');
            return data;
        } catch (error) {
            status.textContent = 'Invalid JSON';
            status.classList.add('invalid');
            if (showError) showNotice(error.message, 'error');
            return null;
        }
    }

    function saveCurrentEdits() {
        if (!REVIEW_ITEMS.length) return;
        const data = parseEditor(false);
        if (data) editedData.set(REVIEW_ITEMS[currentIndex].id, data);
    }

    function showNotice(message, type, link) {
        const preview = document.getElementById('preview');
        let notice = preview.querySelector('.notice');
        if (!notice) {
            notice = document.createElement('div');
            preview.prepend(notice);
        }
        notice.className = 'notice ' + type;
        notice.textContent = message;
        if (link) {
            notice.appendChild(document.createTextNode(' '));
            const anchor = document.createElement('a');
            anchor.href = link;
            anchor.target = '_blank';
            anchor.rel = 'noopener';
            anchor.textContent = 'Check existing entry';
            notice.appendChild(anchor);
        }
        notice.style.display = 'block';
    }

    function clearNotice() {
        const notice = document.querySelector('#preview .notice');
        if (notice) notice.remove();
    }

    function adjustBarLabels(container) {
        const charts = (container || document).querySelectorAll('.grade-chart');
        charts.forEach(chart => {
            const labels = chart.querySelectorAll('.bar-label');
            const bars = Array.from(chart.children).filter(
                element => element.style.position === 'relative'
            );
            if (!labels.length || !bars.length) return;
            const barWidth = bars[0].getBoundingClientRect().width;
            if (!barWidth) return;
            labels.forEach(label => label.style.fontSize = '16px');
            let maxWidth = 0;
            labels.forEach(label => {
                maxWidth = Math.max(maxWidth, label.getBoundingClientRect().width);
            });
            if (!maxWidth) return;
            const size = Math.min(Math.max(Math.floor((barWidth / maxWidth) * 16), 8), 14);
            labels.forEach(label => label.style.fontSize = size + 'px');
        });
    }

    function updateLinks(data) {
        const moduleNumber = String(data['Module Number'] || '').trim();
        const date = String(data.Date || '').trim();
        const url = SITE_URL + '/?query=' + encodeURIComponent(
            (moduleNumber + ' ' + date).trim()
        );
        const link = document.getElementById('existingEntryLink');
        link.href = url;
        link.style.visibility = moduleNumber || date ? 'visible' : 'hidden';
    }

    function updatePreview(showErrors) {
        const data = parseEditor(showErrors);
        if (!data) return Promise.resolve(false);
        editedData.set(REVIEW_ITEMS[currentIndex].id, data);
        updateLinks(data);

        const requestId = ++previewRequest;
        const preview = document.getElementById('preview');
        preview.innerHTML = '<div class="preview-placeholder">Generating preview…</div>';
        return fetch('/preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: data})
        })
            .then(response => response.json().then(body => ({ok: response.ok, body: body})))
            .then(result => {
                if (requestId !== previewRequest) return false;
                if (!result.ok || !result.body.success) {
                    preview.innerHTML = '';
                    showNotice(result.body.message || 'Unable to generate preview.', 'error');
                    return false;
                }
                preview.innerHTML = result.body.html;
                adjustBarLabels(preview);
                checkDuplicate(data, requestId);
                return true;
            })
            .catch(() => {
                if (requestId !== previewRequest) return false;
                preview.innerHTML = '';
                showNotice('Unable to generate the preview.', 'error');
                return false;
            });
    }

    function checkDuplicate(data, requestId) {
        const name = String(data.Name || '').trim();
        const date = String(data.Date || '').trim();
        if (!name || !date) return;
        fetch(API_URL + '/check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: name.split(/\s+/)[0] + ' ' + date})
        })
            .then(response => {
                if (!response.ok) throw new Error('Duplicate check unavailable');
                return response.json();
            })
            .then(result => {
                if (requestId !== previewRequest) return;
                const hit = result.hits && result.hits[0];
                if (!hit || String(hit.Date || '') !== date) return;
                const duplicateUrl = SITE_URL + '/?query=' + encodeURIComponent(
                    String(hit['Module Number'] || '') + ' ' + date
                );
                showNotice('Possible duplicate.', 'warning', duplicateUrl);
            })
            .catch(() => {});
    }

    function loadItem(index, preserveCurrent) {
        if (!REVIEW_ITEMS.length) return;
        if (preserveCurrent !== false) saveCurrentEdits();
        currentIndex = Math.max(0, Math.min(index, REVIEW_ITEMS.length - 1));
        const item = REVIEW_ITEMS[currentIndex];
        const data = editedData.get(item.id) || item.data;

        document.getElementById('itemTitle').textContent =
            data.Name || 'Unnamed submission';
        document.getElementById('queuePosition').textContent =
            (currentIndex + 1) + ' of ' + REVIEW_ITEMS.length;
        document.getElementById('queueCount').textContent =
            REVIEW_ITEMS.length + ' pending';
        document.getElementById('previousButton').disabled = currentIndex === 0;
        document.getElementById('nextButton').disabled =
            currentIndex === REVIEW_ITEMS.length - 1;

        const image = document.getElementById('sourceImage');
        image.src = item.image;
        document.getElementById('openImageLink').href = item.image;
        document.getElementById('jsonEditor').value = JSON.stringify(data, null, 4);
        parseEditor(false);
        updatePreview(false);
    }

    function approveCurrent() {
        const data = parseEditor(true);
        if (!data) return;
        const item = REVIEW_ITEMS[currentIndex];
        const button = document.getElementById('approveButton');
        button.disabled = true;
        button.textContent = 'Publishing…';

        fetch('/update/' + encodeURIComponent(item.id), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: data})
        })
            .then(response => response.json().then(body => ({ok: response.ok, body: body})))
            .then(result => {
                if (!result.ok || !result.body.success) {
                    throw new Error(result.body.message || 'Unable to approve submission.');
                }
                editedData.delete(item.id);
                REVIEW_ITEMS.splice(currentIndex, 1);
                if (!REVIEW_ITEMS.length) {
                    window.location.reload();
                    return;
                }
                if (currentIndex >= REVIEW_ITEMS.length) currentIndex--;
                loadItem(currentIndex, false);
            })
            .catch(error => showNotice(error.message, 'error'))
            .finally(() => {
                button.disabled = false;
                button.innerHTML = 'Approve &amp; next <span class="shortcut">Ctrl ⇧ ↵</span>';
            });
    }

    if (REVIEW_ITEMS.length) {
        document.getElementById('previousButton').addEventListener('click', () => {
            loadItem(currentIndex - 1);
        });
        document.getElementById('nextButton').addEventListener('click', () => {
            loadItem(currentIndex + 1);
        });
        document.getElementById('formatButton').addEventListener('click', () => {
            const data = parseEditor(true);
            if (data) document.getElementById('jsonEditor').value =
                JSON.stringify(data, null, 4);
        });
        document.getElementById('previewButton').addEventListener('click', () => {
            updatePreview(true);
        });
        document.getElementById('approveButton').addEventListener('click', approveCurrent);
        document.getElementById('jsonEditor').addEventListener('input', () => {
            parseEditor(false);
        });
        document.getElementById('sourceImage').addEventListener('click', () => {
            window.open(document.getElementById('sourceImage').src, '_blank', 'noopener');
        });
        document.addEventListener('keydown', event => {
            if (!(event.ctrlKey || event.metaKey) || event.key !== 'Enter') return;
            event.preventDefault();
            if (event.shiftKey) approveCurrent();
            else updatePreview(true);
        });
        window.addEventListener('resize', () => adjustBarLabels(
            document.getElementById('preview')
        ));
        loadItem(0);
    }
</script>
</body>
</html>
